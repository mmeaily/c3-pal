[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.30
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 115200

; Same firmware for the boot enclosure (../boot): the board stands USB-C
; up there, so the screen is turned 180 degrees.
[env:boot]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DC3PAL_ROTATION=U8G2_R2

[env:scan]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = -<*> +<../diag/i2c_scan.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 115200
